<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Memories - Peta Kenangan</title>

  <!-- 1. CSS Leaflet untuk Peta (Library Peta Gratis) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- 2. STYLING / CSS (Semua Tampilan Web) -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fce4ec; /* Warna latar belakang pink lembut */
      color: #333;
    }

    h1 {
      text-align: center;
      padding: 20px;
      color: #d81b60;
    }

    /* Ukuran Tampilan Peta */
    #map {
      height: 75vh;
      width: 90%;
      margin: 0 auto 30px auto;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      border: 4px solid #f48fb1;
    }

    /* Styling Isi Pop-up saat Rumah Diklik */
    .popup-content {
      text-align: center;
      max-width: 250px;
    }

    .popup-content h3 {
      color: #ad1457;
      margin-bottom: 8px;
    }

    .popup-content p {
      font-size: 0.9em;
      margin-bottom: 10px;
      color: #666;
    }

    /* Styling Foto & Video di dalam Pop-up */
    .popup-media {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 8px;
    }

    /* Efek Animasi Membesar saat Rumah Diarahkan Kursor (Hover) */
    .custom-house-icon {
      transition: transform 0.2s ease-in-out;
    }
    .custom-house-icon:hover {
      transform: scale(1.25);
    }
  </style>
</head>
<body>

  <h1>🏡 Peta Kenangan Kita 💖</h1>
  
  <!-- Wadah Tempat Peta Ditampilkan -->
  <div id="map"></div>

  <!-- 3. SCRIPT LEAFLET JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 4. JAVASCRIPT (Logika Peta & Marker Rumah) -->
  <script>
    // A. INISIALISASI PETA
    // Atur koordinat tengah peta [-6.2088, 106.8456] & level zoom (13)
    const map = L.map('map').setView([-6.2088, 106.8456], 13); 

    // Menggunakan Tampilan Peta Gratis dari OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // B. IKON RUMAH LUCU
    const houseIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/619/619153.png', // Gambar rumah imut
      iconSize: [45, 45],       // Ukuran ikon [lebar, tinggi]
      iconAnchor: [22, 45],     // Posisi tumpuan pin di peta
      popupAnchor: [0, -40],    // Posisi munculnya kotak pop-up
      className: 'custom-house-icon'
    });

    // C. DATA RUMAH KENANGAN (Koordinat, Foto, & Video)
    // Kamu bisa ganti koordinat, deskripsi, serta file foto/video kamu di bawah ini!
    const memories = [
      {
        title: "Rumah Kenangan 1 - Cafe Favorit",
        description: "Tempat pertama kali kita nongkrong & ngobrol lama ✨",
        lat: -6.2088,
        lng: 106.8456,
        media: [
          { type: 'image', url: 'https://picsum.photos/300/200?random=1' },
          { type: 'video', url: 'https://www.w3schools.com/html/mov_bbb.mp4' }
        ]
      },
      {
        title: "Rumah Kenangan 2 - Tempat Jalan-jalan",
        description: "Foto pas liburan seru bareng 🌸",
        lat: -6.2200,
        lng: 106.8500,
        media: [
          { type: 'image', url: 'https://picsum.photos/300/200?random=2' }
        ]
      }
    ];

    // D. PROCESS MENAMPILKAN RUMAH & POP-UP DI PETA
    memories.forEach(item => {
      let mediaHTML = '';
      
      // Cek apakah media berupa gambar atau video
      item.media.forEach(m => {
        if (m.type === 'image') {
          mediaHTML += `<img src="${m.url}" class="popup-media" alt="Foto Kenangan">`;
        } else if (m.type === 'video') {
          mediaHTML += `
            <video controls class="popup-media">
              <source src="${m.url}" type="video/mp4">
              Browser tidak mendukung video.
            </video>`;
        }
      });

      // Gabungkan teks & galeri ke pop-up
      const popupContent = `
        <div class="popup-content">
          <h3>${item.title}</h3>
          <p>${item.description}</p>
          ${mediaHTML}
        </div>
      `;

      // Pasang ikon rumah ke koordinat peta
      L.marker([item.lat, item.lng], { icon: houseIcon })
        .addTo(map)
        .bindPopup(popupContent);
    });
  </script>
</body>
</html>
