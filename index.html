<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Memories - Peta Kenangan Spesial</title>

  <!-- CSS Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
      background-color: #fce4ec;
      color: #333;
    }

    h1 {
      text-align: center;
      padding: 20px;
      color: #d81b60;
    }

    /* Tampilan Container Peta Gambar */
    #map {
      height: 75vh;
      width: 90%;
      margin: 0 auto 30px auto;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      border: 4px solid #f48fb1;
      background-color: #fff0f5;
    }

    /* Pop-up Foto & Video */
    .popup-content {
      text-align: center;
      max-width: 240px;
    }

    .popup-content h3 {
      color: #ad1457;
      margin-bottom: 6px;
    }

    .popup-content p {
      font-size: 0.85em;
      margin-bottom: 8px;
      color: #555;
    }

    .popup-media {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 6px;
    }

    /* Efek Ikon Rumah Lucu */
    .custom-house-icon {
      transition: transform 0.2s ease;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
    }
    .custom-house-icon:hover {
      transform: scale(1.3) rotate(-5deg);
    }
  </style>
</head>
<body>

  <h1>🏡 Our Secret Memories Map 💖</h1>
  
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // -----------------------------------------------------------
    // 1. SETUP PETA GAMBAR KUSTOM (NON-GPS)
    // -----------------------------------------------------------
    
    // Ganti URL ini dengan link/path gambar peta buatanmu
    const imageUrl = 'https://picsum.photos/1000/700?random=99'; 
    
    // Ukuran sistem koordinat piksel peta [tinggi, lebar]
    const imageBounds = [[0, 0], [700, 1000]]; 

    const map = L.map('map', {
      crs: L.CRS.Simple, // Menggunakan titik piksel sederhana (Bukan peta dunia GPS)
      minZoom: -1,
      maxZoom: 2
    });

    // Pasang gambar sebagai peta
    L.imageOverlay(imageUrl, imageBounds).addTo(map);
    map.fitBounds(imageBounds);

    // -----------------------------------------------------------
    // 2. IKON RUMAH LUCU
    // -----------------------------------------------------------
    const houseIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/619/619153.png', // Ikon rumah lucu
      iconSize: [50, 50],
      iconAnchor: [25, 50],
      popupAnchor: [0, -45],
      className: 'custom-house-icon'
    });

    // -----------------------------------------------------------
    // 3. DAFTAR LOKASI RUMAH & KENANGAN
    // [y, x] adalah posisi koordinat titik di atas gambar
    // -----------------------------------------------------------
    const memories = [
      {
        title: "Rumah Kenangan 1",
        description: "Momen manis pas pertama kali main ke sini 💕",
        coords: [250, 300], // [Sumbu Y (Tinggi), Sumbu X (Lebar)]
        media: [
          { type: 'image', url: 'https://picsum.photos/300/200?random=1' },
          { type: 'video', url: 'https://www.w3schools.com/html/mov_bbb.mp4' }
        ]
      },
      {
        title: "Rumah Kenangan 2",
        description: "Foto pas kumpul bareng 🌸",
        coords: [450, 700], // Sesuaikan titik posisi rumah pada gambar
        media: [
          { type: 'image', url: 'https://picsum.photos/300/200?random=2' }
        ]
      }
    ];

    // -----------------------------------------------------------
    // 4. PENEMPATAN IKON RUMAH & POP-UP
    // -----------------------------------------------------------
    memories.forEach(item => {
      let mediaHTML = '';
      
      item.media.forEach(m => {
        if (m.type === 'image') {
          mediaHTML += `<img src="${m.url}" class="popup-media" alt="Foto">`;
        } else if (m.type === 'video') {
          mediaHTML += `
            <video controls class="popup-media">
              <source src="${m.url}" type="video/mp4">
            </video>`;
        }
      });

      const popupContent = `
        <div class="popup-content">
          <h3>${item.title}</h3>
          <p>${item.description}</p>
          ${mediaHTML}
        </div>
      `;

      L.marker(item.coords, { icon: houseIcon })
        .addTo(map)
        .bindPopup(popupContent);
    });
  </script>
</body>
</html>
